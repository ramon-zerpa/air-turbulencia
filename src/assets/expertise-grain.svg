<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="12" stitchTiles="stitch" result="noise" />
    <feColorMatrix in="noise" type="saturate" values="0" result="mono" />
    <feComponentTransfer in="mono">
      <feFuncR type="table" tableValues=".24 .78" />
      <feFuncG type="table" tableValues=".24 .78" />
      <feFuncB type="table" tableValues=".24 .78" />
      <feFuncA type="table" tableValues="0 .14" />
    </feComponentTransfer>
  </filter>
  <rect width="128" height="128" filter="url(#grain)" />
</svg>
